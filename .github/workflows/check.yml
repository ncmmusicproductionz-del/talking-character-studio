name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Render smoke test (no internet services)
        run: |
          python -c "import scriptgen, scriptparse; s,_ = scriptgen.generate(8, seed=1); assert len(scriptparse.parse_script(s)) > 50"
          python -c "import render; render.still_frame('christmas', 1, 'Test', 540, 960, None, 'room').save('room.jpg'); render.still_frame('space', 2, 'Test', 960, 540, dict(mode='theme'), 'open').save('open.jpg')"
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-frames
          path: '*.jpg'
